# Stages 6a (gap scan of the Stage 4 structures) and 6 (strain/defect variants): heterostructure single points.
# 4 nodes per structure (user, 2026-11-06: 260-390 atoms). FM Cr + U, D3, dipole, kz=1 come from the driver;
# slab-style mixing comes from dft.incar_rules.
vasp_executable: "/global/common/software/nersc9/vasp/vasp/6.4.2-gpu/bin13/vasp_std"
command: "/host_lib/ld-linux-x86-64.so.2 /global/common/software/nersc9/vasp/vasp/6.4.2-gpu/bin13/vasp_std"
structure_filename: POSCAR
pseudopotentials_directory: "/pscratch/sd/r/rym/MatEnsemble/run_pipeline/DFT/pymatgen_pseudos"
potcar_functional: PBE_54_W_HASH
input_set: MPRelaxSet
nodes: 4                        # pinned: every heterostructure gets 4 GPU nodes
atoms_per_node: 100

user_incar_settings:
  PREC: Accurate
  ENCUT: 520
  ALGO: Normal
  EDIFF_PER_ATOM: 5.0e-05        # pymatgen: EDIFF = 5e-5 eV x natoms (MP default); ~0.013-0.020 eV for 261-390 atoms.
                                #   Do not also set EDIFF here: an explicit EDIFF overrides the per-atom value.
  NELM: 300
  ISMEAR: 0
  SIGMA: 0.05
  IBRION: -1
  NSW: 0
  IVDW: 12
  LASPH: true
  LREAL: Auto
  KPAR: 2
  LWAVE: true
  LCHARG: false

user_kpoints_settings:
  grid_density: 1000
