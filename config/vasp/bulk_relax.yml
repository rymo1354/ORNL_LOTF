# Stage 1: full (ionic + lattice) relaxation of bulk structures.
# Base settings follow Ensemble-FF-Fit examples/Perlmutter/VASP_MACE_ASE/DFT/vdW_single_point.yml.
# Hubbard U, FM MAGMOM and LDIPOL are NOT set here: ornl_lotf.vasp_driver applies them
# from config/pipeline.yaml `dft:` (merged into the run tree's copy of this file).
vasp_executable: "/global/common/software/nersc9/vasp/vasp/6.4.2-gpu/bin13/vasp_std"
command: "/host_lib/ld-linux-x86-64.so.2 /global/common/software/nersc9/vasp/vasp/6.4.2-gpu/bin13/vasp_std"
structure_filename: POSCAR
pseudopotentials_directory: "/pscratch/sd/r/rym/MatEnsemble/run_pipeline/DFT/pymatgen_pseudos"
potcar_functional: PBE_54_W_HASH
input_set: MPRelaxSet          # POTCAR choices (Cr_pv, Te, O, Al, Ba_sv, Ti_pv) and base INCAR
nodes: 0                       # 0 -> ceil(natoms / atoms_per_node)
atoms_per_node: 100
stress_tol_kbar: 2.0            # cell relaxations: max |stress| for convergence (EDIFFG<0 ignores stress)

user_incar_settings:
  PREC: Accurate
  ENCUT: 520
  ALGO: Normal
  EDIFF: 1.0e-06
  EDIFFG: -0.01
  NELM: 150
  ISMEAR: 0
  SIGMA: 0.05
  IBRION: 2
  ISIF: 3                       # cell + ions
  NSW: 100
  IVDW: 12                      # D3(BJ)
  LASPH: true
  LREAL: false
  KPAR: 4                       # must divide the MPI rank count (4 per node)
  SYMPREC: 1.0e-05
  LWAVE: false
  LCHARG: false

user_kpoints_settings:
  grid_density: 3000            # k-points per reciprocal atom (metallic CrTe2)
